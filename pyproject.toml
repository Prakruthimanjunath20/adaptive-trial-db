[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apt-db"
version = "0.1.0"
description = "Amendment-resilient database for a fictional adaptive platform trial (synthetic data only)"
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.1", "pandas>=2.0", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
